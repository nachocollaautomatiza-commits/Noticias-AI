<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Briefing">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1E3932">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192-v2.png">
<link rel="apple-touch-icon" href="icon-192-v2.png">
<title>AI Briefing – Cargando...</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Lato', sans-serif;
    background: linear-gradient(135deg, #1E3932 0%, #00704A 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 24px;
    color: #fff;
  }
  .logo { font-size: 48px; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  p { font-size: 15px; opacity: 0.7; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(255,255,255,0.2);
    border-top-color: #CBA052;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box {
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 20px 28px;
    text-align: center;
    display: none;
  }
  .error-box a { color: #CBA052; }
</style>
</head>
<body>
  <div class="logo">☕</div>
  <h1>Tu Radar Inteligente de IA</h1>
  <p>Cargando el último briefing...</p>
  <div class="spinner"></div>
  <div class="error-box" id="errorBox">
    <p>No se pudo cargar automáticamente.</p>
    <p style="margin-top:8px"><a href="briefing-2026-05-28.html">Ver briefing del 28 de Mayo →</a></p>
  </div>

<script>
  async function limpiarYRedirigir() {
    // 1. Desregistrar TODOS los service workers existentes
    if ('serviceWorker' in navigator) {
      try {
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (const reg of registrations) {
          await reg.unregister();
        }
      } catch(e) {}
    }

    // 2. Borrar TODOS los cachés del browser
    if ('caches' in window) {
      try {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      } catch(e) {}
    }

    // 3. Obtener latest.json forzando red (sin caché)
    try {
      const resp = await fetch('latest.json?nocache=' + Date.now(), {
        cache: 'no-store',
        headers: {
          'Cache-Control': 'no-cache, no-store, must-revalidate',
          'Pragma': 'no-cache'
        }
      });
      const data = await resp.json();
      if (data && data.file) {
        window.location.replace(data.file + '?v=' + Date.now());
        return;
      }
    } catch(e) {}

    // 4. Fallback si no hay red
    document.querySelector('.spinner').style.display = 'none';
    document.querySelector('p').style.display = 'none';
    document.getElementById('errorBox').style.display = 'block';
  }

  limpiarYRedirigir();
</script>
</body>
</html>
